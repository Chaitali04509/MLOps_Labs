name: Lab1 - Testing with Pytest

on:
  push:
    branches:
      - main
    paths:
      - 'Lab1/**'
      - '.github/workflows/lab1_pytest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Lab1/**'
  workflow_dispatch: # allows running manually from the Actions tab

defaults:
  run:
    working-directory: Lab1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: Lab1/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests with coverage
      run: pytest test/test_pytest.py --junitxml=reports/pytest-report.xml --cov=src --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=90

    - name: Print metrics report
      run: python -m src.evaluate

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lab1-test-results-py${{ matrix.python-version }}
        path: Lab1/reports/

    - name: Notify on success
      if: success()
      run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

    - name: Notify on failure
      if: failure()
      run: echo "Tests failed on Python ${{ matrix.python-version }}"
